---

- include_vars: "{{ item }}"
  with_first_found:
    - "../vars/{{ ansible_facts['distribution_release'] }}.yml"
    - "../vars/empty.yml"
  tags: [wireguard]

- name: Install WireGuard (Debian)
  check_mode: no
  become: true
  apt:
    name: "{{ wireguard_package }}"
  when: wireguard_package != ""
  tags: [wireguard]

- name: Install WireGuard (RedHat)
  check_mode: no
  become: true
  yum:
    name: ['kmod-wireguard','wireguard-tools']
  when: ansible_facts["os_family"] == "RedHat"
  tags: [wireguard]
